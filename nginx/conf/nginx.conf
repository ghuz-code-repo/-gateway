# ОСНОВНАЯ КОНФИГУРАЦИЯ NGINX
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DNS resolver for dynamic upstream resolution
    # This allows nginx to start even if upstreams are not available
    # Docker's internal DNS server
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;

    # Основные настройки
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    
    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Extract service key from Referer for Dozzle per-service filtering
    # When iframe at /services/{key}/logs/ makes API calls to /logs/api/...,
    # the Referer still contains the service path, allowing us to apply the filter
    map $http_referer $logs_referer_service {
        ~*/services/([^/]+)/logs  $1;
        default                   "";
    }

    # Rate limiting zones for auth endpoints (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/s;

    # Password recovery: rate-limit ТОЛЬКО отправку (POST). Загрузка страницы (GET)
    # и повторные заходы не должны съедать лимит и упираться в 503.
    # Пустой ключ => nginx не применяет limit_req к запросу.
    map $request_method $recovery_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $recovery_limit_key zone=auth_recovery:10m rate=3r/m;

    # ================================================================
    # QUIZ SERVICE: доступ только с сайта gh.uz
    # ================================================================
    # Запрос разрешён, если Origin ИЛИ Referer указывает на gh.uz:
    #  - fetch/XHR с gh.uz всегда шлёт Origin: https://gh.uz
    #  - загрузка <script src> шлёт Referer: https://gh.uz/...
    map $http_origin $quiz_origin_ok {
        default                      0;
        "~^https://(www\.)?gh\.uz$"  1;
    }
    map $http_referer $quiz_referer_ok {
        default                          0;
        "~^https://(www\.)?gh\.uz(/|$)"  1;
    }
    # Запрещено, только если ОБА признака отсутствуют ("00")
    map "$quiz_origin_ok$quiz_referer_ok" $quiz_gh_uz_denied {
        "00"    1;
        default 0;
    }
    # CORS-origin для статики виджета (зеркалим только разрешённый)
    # ВРЕМЕННО для тестирования: зеркалим любой Origin.
    # Чтобы вернуть защиту — закомментировать первую строку и раскомментировать вторую.
    map $http_origin $quiz_cors_origin {
        default                      $http_origin;
        # default                      "";
        # "~^https://(www\.)?gh\.uz$"  $http_origin;
    }
    # Rate limiting для публичного quiz API
    limit_req_zone $binary_remote_addr zone=quiz_api:10m rate=10r/s;

    # Включаем конфигурации из conf.d/
    include /etc/nginx/conf.d/*.conf;
}
