{{ define "head" }}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Мобильное веб-приложение: контент заходит под вырез (viewport-fit),
         запуск с домашнего экрана — без адресной строки, системная строка
         красится в цвет шапки (актуальный цвет ставит mobile-ux.js). -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Портал GH">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/img/logo-mark.svg">
    <title>{{ .title }} - Сервис аутентификации</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    {{ if .extraCSS }}
        {{ range .extraCSS }}
            <link rel="stylesheet" href="{{ . }}">
        {{ end }}
    {{ end }}
    {{ if .fontAwesome }}
        <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    {{ end }}
    <style>
      body {
        visibility: hidden;
        opacity: 0;
        transition: opacity .05s ease-in-out;
      }
    </style>
    <!-- Мобильный слой подключается последним: он переопределяет легаси-правила
         выше и инлайновые <style> этой страницы при равной специфичности. -->
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile-ux.js"></script>
</head>
{{ end }}
