{{ define "header" }}
<!-- HEADER DEBUG: username=[{{ .username }}], short_name=[{{ .short_name }}], user=[{{ .user }}] -->
<header class="header-container">
    <div class="header-logo-section"> <!-- Changed from top-left for consistency with CSS -->
        <!-- В сервисах логотип ведёт в меню сервисов, а название — на главную
             своего сервиса. Здесь портал и есть это меню, поэтому обе половины
             ведут в /menu и объединены в одну ссылку. -->
        <a href="/menu" class="brand-link" title="К меню сервисов">
            <!-- Только герб, без словесной части: название компании в шапке
                 дублировало бы название сервиса рядом. Герб золотой в обеих
                 темах, поэтому id="dynamic-logo" снят — подмена по теме не нужна
                 (оба обработчика в theme-switcher.js и mobile-menu.js проверяют
                 элемент на null, так что ничего не ломается). -->
            <img src="/static/img/logo-mark.svg" alt="Golden House" class="logo-img">
            <span class="brand-name">Портал</span>
        </a>
    </div>

    <!-- Desktop Header Controls -->
    <div class="header-controls-section">
        <!-- TEMP: Removed {{if .username }} check for debugging -->
        <a href="/profile" class="header-profilr-link" title="Личный кабинет">
            <div class="avatar-section">
                <div class="avatar-mini">
                    {{ if .user.AvatarPath }}
                        <img src="{{ .user.AvatarPath }}" alt="Аватар" id="headerAvatarImage">
                    {{ else }}
                        <i class="fas fa-user-circle" id="headerDefaultAvatar"></i>
                    {{ end }}
                </div>
            </div>
            <div class="header-user-info">
                <!-- DEBUG: short_name=[{{ .short_name }}], full_name=[{{ .full_name }}], username=[{{ .username }}] -->
                {{ if .short_name }}<span class="header-fullname">{{ .short_name }}</span>{{ else }}<!-- NO SHORT_NAME -->{{ end }}
                <span class="header-username">({{ .username }})</span>
            </div>
        </a>
        <!-- TEMP: Removed {{end}} -->
        <div class="header-buttons">
            <button id="theme-switcher" title="Сменить тему">
                <i class="fas fa-moon"></i> <!-- Icon changes via JS -->
            </button>
            <!-- TEMP: Removed {{if .username }} check for logout button -->
            <a href="/logout" class="logout-btn" title="Выход">
                <i class="fas fa-sign-out-alt"></i>
                <!-- <span class="logout-text">Выход</span> --> <!-- Optional: text next to icon -->
            </a>
            <!-- TEMP: Removed {{end}} -->
        </div>
        </div>
    </div>

    <!-- Burger Menu Button (shown on mobile via CSS) -->
    <button id="burger-menu-toggle" class="burger-menu-button" aria-label="Открыть меню" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>

<!-- Mobile Menu Modal (Place outside .header-container but within the define block) -->
<div id="mobile-menu-modal" class="mobile-menu-modal">
    <button id="mobile-menu-close" class="mobile-menu-close-button">&times;</button>
    
    {{if .username }}
    <div class="mobile-user-info">
        <span class="header-username">{{ .username }}</span>
        {{ if .short_name }}<span class="header-fullname">({{ .short_name }})</span>{{ end }}
    </div>
    {{end}}

    <button id="theme-switcher-mobile" class="btn">
        <i class="fas fa-moon"></i> Тёмная тема <!-- Text and icon will be updated by JS -->
    </button>
    
    {{if .username }}
    <a href="/profile" class="btn">
        <i class="fas fa-user-circle"></i> Личный кабинет
    </a>
    <a href="/logout" class="btn">
        <i class="fas fa-sign-out-alt"></i> Выход
    </a>
    {{end}}
    <!-- You can add other navigation links here if needed for mobile -->
</div>
<div id="modal-backdrop" class="modal-backdrop"></div>
{{ end }}
