services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gateway-nginx-1
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
    volumes:
      # Mount main nginx config
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount conf.d configs
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf/gateway.inc:/etc/nginx/conf.d/gateway.inc:ro
      - ./nginx/conf/quiz.inc:/etc/nginx/conf.d/quiz.inc:ro
      # Страницы ошибок: конфиг и сами страницы монтируются, чтобы
      # правка текста применялась перезагрузкой, без пересборки образа
      - ./nginx/conf/errors.inc:/etc/nginx/conf.d/errors.inc:ro
      - ./nginx/conf/errors-pages.inc:/etc/nginx/conf.d/errors-pages.inc:ro
      - ./nginx/conf/errors-preview.inc:/etc/nginx/conf.d/errors-preview.inc:ro
      - ./nginx/html/errors:/usr/share/nginx/html/errors:ro
      # Mount dynamic configs (writable for service discovery)
      - nginx_dynamic_config:/etc/nginx/conf.d/dynamic
      # Mount certs
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      - TZ=Asia/Tashkent
      # Логин Telegram (без @) для ссылки «написать в поддержку» на страницах
      # ошибок. Пусто — ссылка не выводится.
      - SUPPORT_TELEGRAM=${SUPPORT_TELEGRAM:-}
    security_opt:
      - no-new-privileges:true
    networks:
      - public_network      # Для приема внешних запросов
      - service_network     # Для проксирования в микросервисы
      - quiz_network        # Для проксирования в изолированный quiz-сервис
    restart: always
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - ./auth-service/.env
    depends_on:
      - mongo
      - docker-socket-proxy
    networks:
      - service_network     # Для общения с другими сервисами
      - data_network        # Для доступа к MongoDB
    volumes:
      - ./auth-service/data:/root/data
      - ./auth-service/static:/root/static
      - ./auth-service/templates:/root/templates
      - nginx_dynamic_config:/etc/nginx/conf.d/dynamic  # Shared volume for nginx configs
    environment:
      - TZ=Asia/Tashkent
      - NOTIFICATION_SERVICE_URL=http://notification-service:80
      - NGINX_CONTAINER_NAME=gateway-nginx-1
      - NGINX_DYNAMIC_CONFIG_DIR=/etc/nginx/conf.d/dynamic
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - NOTIFICATION_BOT_URL=http://notification-bot:80
    # --- Харднинг: захваченный контейнер не сможет поднять привилегии ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :80
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE       # запись в bind-mount директории
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  notification-bot:
    build:
      context: ./notification-bot
      dockerfile: Dockerfile
    container_name: gateway-notification-bot
    env_file:
      - ./notification-bot/.env
    depends_on:
      - auth-service
    networks:
      - service_network     # Прием запросов от auth-service и вызовы его внутреннего API
      - egress_network      # Выход в интернет для Telegram Bot API
    environment:
      - TZ=Asia/Tashkent
      - AUTH_SERVICE_URL=http://auth-service:80
    # --- Харднинг: захваченный контейнер не сможет поднять привилегии ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :80
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:6
    restart: always
    command: ["--auth"]
    security_opt:
      - no-new-privileges:true
    networks:
      - data_network
    volumes:
      - ./mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    environment:
      - MONGO_INITDB_DATABASE=authdb
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
      - TZ=Asia/Tashkent
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  monitoring-service:
    build:
      context: ./monitoring-service
      dockerfile: Dockerfile
    container_name: gateway-monitoring-service
    env_file:
      - ./monitoring-service/.env
    depends_on:
      - auth-service
    networks:
      - service_network     # Только внутренняя сеть сервисов
    environment:
      - TZ=Asia/Tashkent
    # --- Харднинг: захваченный контейнер не сможет поднять привилегии ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :80
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: gateway-docker-proxy
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Asia/Tashkent
      # Only allow container-related operations (logs for dozzle, signal for nginx reload)
      - CONTAINERS=1
      - INFO=1          # Required for dozzle v10+ (GET /info on startup)
      - POST=1          # Required for container kill (SIGHUP for nginx reload)
      - EXEC=0          # Disabled — nginx reload uses SIGHUP signal instead
      - LOG=1           # Required for dozzle log streaming
      - EVENTS=1        # Required for dozzle real-time updates
      # Block everything else
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - BUILD=0
      - COMMIT=0
      - SWARM=0
      - NODES=0
      - SERVICES=0
      - TASKS=0
      - SECRETS=0
      - CONFIGS=0
    networks:
      - service_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  dozzle:
    image: amir20/dozzle:latest
    container_name: gateway-dozzle
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker-socket-proxy
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - DOZZLE_LEVEL=info
      # Forward proxy mode for per-service access control
      - DOZZLE_AUTH_PROVIDER=forward-proxy
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_BASE=/logs
      - TZ=Asia/Tashkent
    networks:
      - service_network     # Только внутренняя сеть (доступ через nginx)
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nginx_dynamic_config:  # Shared volume for dynamic nginx configs

networks:
  # Публичная сеть - ТОЛЬКО для nginx (единственная точка входа извне)
  public_network:
    name: public_network
    driver: bridge
  
  # Сеть для всех микросервисов (изолирована от внешнего мира через nginx)
  service_network:
    name: service_network
    driver: bridge
    internal: true  # Изолирована от внешнего мира
  
  # Сеть для сервисов, которым нужен выход в интернет (SMTP, Telegram API).
  # Создаётся заранее скриптом start_all.sh (docker network create с
  # enable_icc=false — контейнеры в ней не видят друг друга), поэтому external.
  egress_network:
    name: egress_network
    external: true
  
  # Изолированная сеть для auth-service и MongoDB
  data_network:
    name: data_network
    driver: bridge
    internal: true  # Полностью изолирована - только auth-service имеет доступ

  # Изолированная сеть для quiz-сервиса (только nginx <-> quiz-контейнеры).
  # quiz-сервис НЕ входит в service_network и не имеет доступа
  # к auth-service, notification-service и другим сервисам.
  quiz_network:
    name: quiz_network
    driver: bridge
    internal: true  # Изолирована от внешнего мира
